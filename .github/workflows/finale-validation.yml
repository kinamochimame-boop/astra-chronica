name: v2.6 complete integration (no deployment)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/finale-validation.yml'
permissions:
  contents: read
concurrency:
  group: finale-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  unit:
    if: github.head_ref == 'feature/v2.6-chapter-eighteen-finale' && github.event.pull_request.head.repo.full_name == github.repository && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/ci-v26.mjs unit
        env:
          V26_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v26-unit
          path: .ci-v26/unit
          include-hidden-files: true
          retention-days: 14
  browsers:
    if: github.head_ref == 'feature/v2.6-chapter-eighteen-finale' && github.event.pull_request.head.repo.full_name == github.repository && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [fresh, layouts, new, webgl, old-0, old-1, old-2, old-3, old-4, old-5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Provide native Chromium compatibility path
        run: |
          CHROME_PATH=$(node --input-type=module -e "import {chromium} from '@playwright/test';process.stdout.write(chromium.executablePath())")
          sudo ln -sf "$CHROME_PATH" /usr/bin/chromium
      - run: node tests/ci-v26.mjs "${{ matrix.group }}"
        env:
          V26_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v26-${{ matrix.group }}
          path: .ci-v26/${{ matrix.group }}
          include-hidden-files: true
          retention-days: 14
  collect:
    if: always() && github.head_ref == 'feature/v2.6-chapter-eighteen-finale' && github.event.pull_request.head.repo.full_name == github.repository && github.event.repository.private == false
    needs: [unit, browsers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: v26-*
          path: .ci-v26-results
      - name: Verify receipts and prepare final evidence
        run: node tests/ci-v26-collect.mjs
        env:
          V26_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          V26_PR_URL: ${{ github.event.pull_request.html_url }}
          V26_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v26-verified-final-evidence
          path: |
            docs/FINAL_INTEGRATION_V26.md
            docs/CHANGED_FILES_V26.txt
            docs/test-results/v26.json
            docs/test-results/v26-ci
            docs/screenshots/chapter-eighteen-*.png
            docs/screenshots/exploration-v26-*.png
            docs/screenshots/journey-v26-*.png
          retention-days: 14
